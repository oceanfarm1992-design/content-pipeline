name: Build Episodes
# Renders finished episodes from a series' scripts, for review. Posts nothing.
#   clips  -> Modal L40S (Wan 2.1 1.3B), one container per episode   [spends Modal credit, capped by max_usd]
#   voice  -> Kokoro on the runner
#   music  -> Stable Audio Open Small on the runner, one job per episode
#   build  -> FFmpeg: vertical 720x1280, captions, voice + music mix
on:
  workflow_dispatch:
    inputs:
      stories:
        description: Comma-separated story ids
        default: S0001,S0002,S0003
      data_ref:
        description: Branch holding the scripts (series/)
        default: season-1
      steps:
        description: Wan sampling steps
        default: '25'
      max_usd:
        description: Refuse to start if the Modal estimate is above this
        default: '5'

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      stories: ${{ steps.list.outputs.stories }}
    steps:
      - id: list
        run: echo "stories=$(echo '${{ inputs.stories }}' | python3 -c 'import json,sys; print(json.dumps([s.strip() for s in sys.stdin.read().split(",") if s.strip()]))')" >> "$GITHUB_OUTPUT"

  clips:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - run: git checkout "origin/${{ inputs.data_ref }}" -- series/
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install modal
      - name: Render clips on Modal
        run: |
          set -o pipefail
          modal run scripts/modal_video.py::episodes --stories "${{ inputs.stories }}" --steps ${{ inputs.steps }} \
            --max-usd ${{ inputs.max_usd }} --out out/clips | tee clips.log
          { echo "## Clips"; echo '```json'; cat out/clips/report.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with: { name: clips, path: out/clips/ }

  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - run: git checkout "origin/${{ inputs.data_ref }}" -- series/
      - name: Start Kokoro-FastAPI (CPU)
        run: |
          docker run -d --name kokoro -p 8880:8880 ghcr.io/remsky/kokoro-fastapi-cpu:v0.9.2
          for i in $(seq 1 60); do curl -sf http://localhost:8880/v1/audio/voices > /dev/null && exit 0; sleep 5; done
          docker logs kokoro; exit 1
      - run: python scripts/render_voice.py --stories "${{ inputs.stories }}" --out out/voice
      - uses: actions/upload-artifact@v4
        with: { name: voice, path: out/voice/ }

  music:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        story: ${{ fromJSON(needs.setup.outputs.stories) }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - run: git checkout "origin/${{ inputs.data_ref }}" -- series/
      - uses: actions/setup-python@v5
        with: { python-version: '3.10' }
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/huggingface
          key: models-music-sao-small-torch271
      - run: |
          pip install torch==2.7.1 torchaudio==2.7.1 torchvision==0.22.1 --index-url https://download.pytorch.org/whl/cpu
          pip install "stable-audio-tools[train]" "numpy<2"
      - env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/generate_music.py --story ${{ matrix.story }} --out out/music
      - uses: actions/upload-artifact@v4
        with: { name: 'music-${{ matrix.story }}', path: 'out/music/${{ matrix.story }}_music.wav' }

  build:
    needs: [clips, voice, music]
    if: always() && needs.clips.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - run: git checkout "origin/${{ inputs.data_ref }}" -- series/
      - uses: actions/download-artifact@v4
        with: { name: clips, path: out/clips }
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with: { name: voice, path: out/voice }
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with: { pattern: 'music-*', path: out/music, merge-multiple: true }
      - run: which ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - name: Assemble episodes
        run: |
          set -o pipefail
          python scripts/assemble_episode.py --stories "${{ inputs.stories }}" --out out/episodes | tee build.log
          { echo "## Episodes"; echo '```'; cat build.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with: { name: episodes, path: out/episodes/ }
