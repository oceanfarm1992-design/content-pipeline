name: Setup Models
# Downloads and caches each stage's models, then proves they run on a CPU runner:
#   image -> character reference sheets with Anima-Turbo (series/refs/*.png)
#   voice -> one line per character with Kokoro
#   music -> a 60 s bed for S0001 with Stable Audio Open Small (needs the HF_TOKEN secret)
on:
  workflow_dispatch:
    inputs:
      stages:
        description: Stages to set up
        type: choice
        options: [all, image, voice, music]
        default: all

jobs:
  image:
    if: inputs.stages == 'all' || inputs.stages == 'image'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/sd-cli
      - uses: actions/cache@v4
        with:
          path: models/anima
          key: models-image-${{ hashFiles('scripts/models.txt') }}
      - run: bash scripts/download_models.sh image
      - name: Render character reference sheets
        timeout-minutes: 280
        run: |
          set -o pipefail
          python scripts/render_refs.py --sd-cli bin/sd-cli --size 768x768 --steps 8 | tee render.log
          { echo "## Image: Anima-Turbo reference sheets"; sed -n '/^| id/,$p' render.log; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: character-refs
          path: |
            series/refs/
            render.log

  voice:
    if: inputs.stages == 'all' || inputs.stages == 'voice'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Start Kokoro-FastAPI (CPU)
        run: |
          docker run -d --name kokoro -p 8880:8880 ghcr.io/remsky/kokoro-fastapi-cpu:v0.9.2
          for i in $(seq 1 60); do
            curl -sf http://localhost:8880/v1/audio/voices > /dev/null && { echo "ready after $((i*5))s"; exit 0; }
            sleep 5
          done
          docker logs kokoro; exit 1
      - name: Render one line per character
        run: |
          set -o pipefail
          python scripts/voice_smoke.py --url http://localhost:8880 --out out/voice | tee voice.log
          { echo "## Voice: Kokoro"; cat voice.log; } >> "$GITHUB_STEP_SUMMARY"
      - if: failure()
        run: docker logs kokoro | tail -50
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: voice-samples
          path: |
            out/voice/
            voice.log

  music:
    if: inputs.stages == 'all' || inputs.stages == 'music'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'   # stable-audio-tools requires >=3.10,<3.11
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/huggingface
          key: models-music-sao-small-torch271
      # CPU torch first so the pinned torch==2.7.1 is satisfied without the CUDA wheels.
      # numpy<2: stable-audio-tools pins PyWavelets 1.4.1, which is built against numpy 1.x.
      # [train]: the inference path still imports pytorch_lightning (models/lora/callbacks.py).
      - run: |
          pip install torch==2.7.1 torchaudio==2.7.1 --index-url https://download.pytorch.org/whl/cpu
          pip install "stable-audio-tools[train]" "numpy<2"
          python -c "from stable_audio_tools.models.diffusion import ConditionedDiffusionModelWrapper"
      - name: Render S0001 music bed
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -o pipefail
          [ -n "$HF_TOKEN" ] || { echo "::error::Add an HF_TOKEN secret from an account that accepted the stable-audio-open-small terms"; exit 1; }
          python scripts/generate_music.py --story S0001 --out out/music | tee music.log
          { echo "## Music: Stable Audio Open Small"; sed -n '/^| story/,$p' music.log; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: music-samples
          path: |
            out/music/
            music.log
